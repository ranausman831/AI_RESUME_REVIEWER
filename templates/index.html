<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AI Resume Reviewer</title>

<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
        color: #1f2937;
        min-height: 100vh;
    }

    .container {
        width: 90%;
        max-width: 900px;
        margin: 50px auto;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 36px;
        color: #1e3a8a;
        margin-bottom: 10px;
    }

    .header p {
        color: #6b7280;
        font-size: 16px;
    }

    .upload-card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        text-align: center;
        margin-bottom: 30px;
    }

    .upload-card h2 {
        margin-bottom: 10px;
        color: #111827;
    }

    .upload-card p {
        color: #6b7280;
        margin-bottom: 25px;
    }

    input[type="file"] {
        width: 100%;
        padding: 12px;
        border: 2px dashed #cbd5e1;
        border-radius: 10px;
        margin-bottom: 20px;
        background: #f8fafc;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 13px 30px;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .feedback-card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .feedback-card h2 {
        color: #1e3a8a;
        margin-bottom: 20px;
    }

    .feedback {
        white-space: pre-wrap;
        line-height: 1.7;
        color: #374151;
        font-size: 15px;
    }

    @media (max-width: 600px) {

        .container {
            width: 94%;
            margin: 30px auto;
        }

        .header h1 {
            font-size: 28px;
        }

        .upload-card,
        .feedback-card {
            padding: 22px;
        }

    }

</style>


</head>

<body>


<div class="container">

    <div class="header">
        <h1>AI Resume Reviewer</h1>
        <p>Upload your resume and get AI-powered feedback</p>
    </div>


    <div class="upload-card">

        <h2>Upload Your Resume</h2>

        <p>Supported formats: PDF and DOCX</p>

        <form method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="resume"
                accept=".pdf,.docx"
                required
            >

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>


    {% if feedback %}

    <div class="feedback-card">

        <h2>AI Resume Feedback</h2>

        <div class="feedback">
            {{ feedback }}
        </div>

    </div>

    {% endif %}

</div>


</body>

</html>
